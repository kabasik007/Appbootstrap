name: Android CI

on:
  push:
    branches: [android]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - name: Unit tests, Android lint and APK build
        run: gradle --project-dir android :core:data:test :feature:home:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: appbootstrap-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
