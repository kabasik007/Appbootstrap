name: Windows player prototype

on:
  push:
    branches:
      - apps/windows-media-player
    paths:
      - "apps/windows-media-player/**"
      - ".github/workflows/windows-player.yml"
  pull_request:
    paths:
      - "apps/windows-media-player/**"
      - ".github/workflows/windows-player.yml"

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/windows-media-player
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows-media-player
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check roadmap schema and generated plan
        run: python tools/roadmap_sync.py --check
      - name: Validate full EQ UI contract
        run: python tools/check_ui_contract.py
      - name: Show Rust toolchain and target
        run: |
          rustc -vV
          cargo -V
      - name: Check project
        run: cargo check
      - name: Run Rust tests
        run: cargo test
      - name: Build release executable
        run: cargo build --release
      - name: Create downloader alpha portable ZIP
        shell: pwsh
        run: |
          $destination = Join-Path $PWD "portable/ZillaPlayer"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $exe = Join-Path $PWD "target/release/zillaplayer.exe"
          Copy-Item $exe (Join-Path $destination "zillaplayer.exe")
          Copy-Item "README_DOWNLOADS_UA.txt" (Join-Path $destination "README_DOWNLOADS_UA.txt")
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $destination "SHA256SUMS.txt") -Value "$hash  zillaplayer.exe"
          Compress-Archive -Path $destination -DestinationPath (Join-Path $PWD "portable/ZillaPlayer-Downloader-Alpha-Windows-x64.zip") -Force
      - name: Upload unsigned portable alpha
        uses: actions/upload-artifact@v4
        with:
          name: zillaplayer-downloader-windows-x64-alpha
          path: |
            apps/windows-media-player/portable/ZillaPlayer-Downloader-Alpha-Windows-x64.zip
            apps/windows-media-player/target/release/zillaplayer.exe
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test scanner in actual Windows child-process mode
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "zillaplayer-scan-fixture"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $folder "alpha.MP3"), "fixture")
          [System.IO.File]::WriteAllText((Join-Path $folder "beta.flac"), "fixture")
          [System.IO.File]::WriteAllText((Join-Path $folder "ignore.txt"), "fixture")
          $exe = Join-Path $PWD "target/release/zillaplayer.exe"
          $lines = @(& $exe --scan-worker $folder)
          if ($LASTEXITCODE -ne 0) { throw "scanner subprocess returned $LASTEXITCODE" }
          $decoded = @($lines | ForEach-Object { $_ | ConvertFrom-Json })
          if ($decoded.Count -ne 2) { throw "expected 2 media files, got $($decoded.Count)" }
          if (-not ($decoded | Where-Object { $_ -like "*alpha.MP3" })) { throw "missing MP3" }
          if (-not ($decoded | Where-Object { $_ -like "*beta.flac" })) { throw "missing FLAC" }
      - name: Upload resolved Cargo.lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaplayer-resolved-cargo-lock
          path: apps/windows-media-player/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
