[package]
name = "zillaplayer"
version = "0.3.1-alpha.1"
edition = "2021"
description = "ZillaPlayer native Windows desktop player alpha"
build = "build.rs"
publish = false

[dependencies]
slint = "=1.18.1"
rodio = "=0.21.1"
rfd = "=0.15.4"
serde_json = "1.0"
rustfft = "=6.4.1"
url = "2.5"

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
