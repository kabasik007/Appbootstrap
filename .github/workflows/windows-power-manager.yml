name: Windows Power Manager
on:
  push:
    branches: ['apps/windows-power-manager']
    paths:
      - 'apps/windows-power-manager/**'
      - '.github/workflows/windows-power-manager.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-power-manager
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows-power-manager
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ZillaPowerManager-Windows-x64
          path: apps/windows-power-manager/target/release/zilla-power-manager.exe
          if-no-files-found: error
