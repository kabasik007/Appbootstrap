name: Windows player prototype

on:
  push:
    branches:
      - apps/windows-media-player
    paths:
      - "apps/windows-media-player/**"
      - ".github/workflows/windows-player.yml"
  pull_request:
    paths:
      - "apps/windows-media-player/**"
      - ".github/workflows/windows-player.yml"

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/windows-media-player
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows-media-player
      - name: Check project
        run: cargo check
      - name: Run Rust tests
        run: cargo test
      - name: Build release executable
        run: cargo build --release
