name: Windows player prototype

on:
  push:
    branches:
      - apps/windows-media-player
    paths:
      - "apps/windows-media-player/**"
      - ".github/workflows/windows-player.yml"
  pull_request:
    paths:
      - "apps/windows-media-player/**"
      - ".github/workflows/windows-player.yml"

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/windows-media-player
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the exact branch head, not GitHub's synthetic PR merge commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows-media-player
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check roadmap schema and generated plan
        run: python tools/roadmap_sync.py --check
      - name: Validate full EQ UI contract
        run: python tools/check_ui_contract.py
      - name: Show Rust toolchain and target
        run: |
          rustc -vV
          cargo -V
      - name: Check project
        run: cargo check
      - name: Run Rust tests
        run: cargo test
      - name: Build release executable
        run: cargo build --release
      - name: Create downloader alpha portable ZIP
        shell: pwsh
        run: |
          $destination = Join-Path $PWD "portable/ZillaPlayer"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $exe = Join-Path $PWD "target/release/zillaplayer.exe"
          Copy-Item $exe (Join-Path $destination "zillaplayer.exe")
          Copy-Item "README_DOWNLOADS_UA.txt" (Join-Path $destination "README_DOWNLOADS_UA.txt")
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $destination "SHA256SUMS.txt") -Value "$hash  zillaplayer.exe"
          Compress-Archive -Path $destination -DestinationPath (Join-Path $PWD "portable/ZillaPlayer-v0.3.1-alpha.1-Windows-x64.zip") -Force
      - name: Upload unsigned portable alpha
        uses: actions/upload-artifact@v4
        with:
          name: zillaplayer-v0.3.1-alpha.1-windows-x64
          path: |
            apps/windows-media-player/portable/ZillaPlayer-v0.3.1-alpha.1-Windows-x64.zip
            apps/windows-media-player/target/release/zillaplayer.exe
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test scanner in actual Windows child-process mode
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "zillaplayer-scan-fixture"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $folder "alpha.MP3"), "fixture")
          [System.IO.File]::WriteAllText((Join-Path $folder "beta.flac"), "fixture")
          [System.IO.File]::WriteAllText((Join-Path $folder "ignore.txt"), "fixture")
          $exe = Join-Path $PWD "target/release/zillaplayer.exe"
          $lines = @(& $exe --scan-worker $folder)
          if ($LASTEXITCODE -ne 0) { throw "scanner subprocess returned $LASTEXITCODE" }
          $decoded = @($lines | ForEach-Object { $_ | ConvertFrom-Json })
          if ($decoded.Count -ne 2) { throw "expected 2 media files, got $($decoded.Count)" }
          if (-not ($decoded | Where-Object { $_ -like "*alpha.MP3" })) { throw "missing MP3" }
          if (-not ($decoded | Where-Object { $_ -like "*beta.flac" })) { throw "missing FLAC" }
      - name: Upload resolved Cargo.lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaplayer-resolved-cargo-lock
          path: apps/windows-media-player/Cargo.lock
          if-no-files-found: warn
          retention-days: 14

  publish-alpha:
    # Releases are opt-in through a trusted push commit marker only.
    # Pull requests validate code but never publish binaries.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-alpha]')
    needs: windows-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zillaplayer-v0.3.1-alpha.1-windows-x64
          path: release
      - name: Publish checked Windows alpha ZIP as GitHub Prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="zillaplayer-v0.3.1-alpha.1"
          asset="release/portable/ZillaPlayer-v0.3.1-alpha.1-Windows-x64.zip"
          test -s "$asset"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists. Refusing to replace published binaries."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ZillaPlayer 0.3.1 Alpha 1 — Windows 10/11 x64 (unsigned portable build)

          Includes:
          - Ukrainian-first interface, local library and named playlists.
          - 31-band DSP EQ and corrected vertical gain direction (+12 dB top).
          - Live FFT spectrum that grows upwards, playback and playlist controls.
          - yt-dlp/FFmpeg downloader queue for authorized audio/video, 1440p QHD video mux, MP3 extraction.
          - Metadata Analyze, playlist preview and selection, bundled-tool discovery.
          - Fixed track switching: seek slider and elapsed time reset to 00:00.
          - Faster horizontal EQ pan (380 px jump controls), scrollable queue and playlists.
          - Filename, rating, folder sorting; user-set 0–5 star ratings persisted between launches.
          - Best-effort global multimedia keyboard keys Play/Pause, Next, Previous and Stop (Windows).

          Install:
          1. Download the attached ZIP, extract it and run ZillaPlayer/zillaplayer.exe.
          2. To test downloads, separately install trusted yt-dlp and FFmpeg; Deno can help for some YouTube sources. Setup instructions are inside the ZIP.
          3. Only download media you own or are permitted to save; no DRM bypass.

          This is a test alpha, not a signed/stable production release. Hardware audio and live-source downloading need real-world testing.
          NOTES
          gh release create "$tag" "$asset" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ZillaPlayer v0.3.1 Alpha 1 — Windows x64" \
            --notes-file release-notes.md \
            --prerelease
