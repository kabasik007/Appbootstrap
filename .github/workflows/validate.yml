name: Appbootstrap checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contract and Markdown links
        run: python3 scripts/validate.py
      - name: Test bootstrap generator
        run: python3 -m unittest discover -s tests -v

