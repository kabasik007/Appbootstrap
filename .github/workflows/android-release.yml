name: Android signed release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - name: Validate version and signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Android tag"; exit 1; }
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || {
            echo "Android release signing secrets are required"; exit 1;
          }
          printf %s "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
      - name: Test, lint and assemble signed release APK
        env:
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --project-dir android :core:data:test :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose             android/app/build/outputs/apk/release/app-release.apk
      - name: Generate APK checksum
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release.apk | sed "s|  app-release.apk|  Appbootstrap-$GITHUB_REF_NAME.apk|" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "android/app/build/outputs/apk/release/app-release.apk#Appbootstrap-$GITHUB_REF_NAME.apk" "android/app/build/outputs/apk/release/SHA256SUMS#SHA256SUMS" --title "Android $GITHUB_REF_NAME" --generate-notes
