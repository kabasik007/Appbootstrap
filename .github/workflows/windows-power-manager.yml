name: Windows Power Manager
on:
  push:
    branches: ['apps/windows-power-manager']
    paths:
      - 'apps/windows-power-manager/**'
      - '.github/workflows/windows-power-manager.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-power-manager
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 diagnostics encoding and syntax
        shell: powershell
        run: |
          $file = Join-Path $PWD 'scripts/diagnose_windows11.ps1'
          $bytes = [System.IO.File]::ReadAllBytes($file)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
            throw 'Diagnostic PS1 must be saved as UTF-8 with BOM for Windows PowerShell 5.1'
          }
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            throw ($parseErrors | Out-String)
          }
          $report = Join-Path $env:RUNNER_TEMP 'Zilla_Diagnostic_CI.txt'
          & $file -OutputPath $report
          if (-not (Test-Path -LiteralPath $report)) {
            throw 'Diagnostic script did not create its report'
          }
          if (-not ((Get-Content -LiteralPath $report -Raw) -match 'Zilla Power Manager')) {
            throw 'Report content validation failed'
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows-power-manager
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ZillaPowerManager-Windows-x64
          path: apps/windows-power-manager/target/release/zilla-power-manager.exe
          if-no-files-found: error
